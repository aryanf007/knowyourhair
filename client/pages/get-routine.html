<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Personalized Routine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="oils.html">Oils Guide</a>
            <a href="get-routine.html" class="active">Get Routine</a>
            <button id="auth-btn">Login / Sign Up</button>
        </nav>
    </header>

    <main class="container">
        <h1>Custom Routine Generator</h1>
        <p>Select your preferences below to build a tailored daily regimen.</p>

        <form id="routine-form">
            <div class="form-group">
                <label for="hair-type">Select Hair / Skin Type:</label>
                <select id="hair-type" name="hairType" required>
                    <option value="" disabled selected>Choose an option</option>
                    <option value="dry">Dry / High Porosity</option>
                    <option value="oily">Oily / Low Porosity</option>
                    <option value="combination">Combination / Normal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="primary-goal">Primary Goal:</label>
                <select id="primary-goal" name="primaryGoal" required>
                    <option value="" disabled selected>Choose a goal</option>
                    <option value="growth">Hair Growth & Strength</option>
                    <option value="moisture">Deep Moisture & Shine</option>
                    <option value="scalp-health">Scalp Care & Nourishment</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Generate Routine</button>
        </form>

        <div id="routine-results" class="results-card" style="display: none;">
            <h2>Your Recommended Plan</h2>
            <div id="routine-details"></div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="routine.js"></script>
</body>
</html>
